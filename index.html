<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOSEGAME - Aposta Esportiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24 bg-slate-100 text-slate-900">

    <!-- CABEÇALHO CLARO -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2 cursor-pointer" onclick="limparFiltroEEstado()">
            <div class="bg-amber-500 text-slate-950 px-2 py-1 rounded-lg font-black text-lg">NG</div>
            <span class="font-black text-xl tracking-wider text-slate-900">NOSE<span class="text-amber-500">GAME</span></span>
        </div>
        <button onclick="abrirModalConsultarPIN()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 py-2 rounded-xl border border-slate-300 font-bold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-search text-amber-500"></i> Consultar Bilhete
        </button>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-4xl w-full mx-auto px-3 pt-4 flex-1">
        <!-- BARRA DE FILTROS POR LIGA -->
        <div id="leagueFilters" class="flex gap-2 overflow-x-auto pb-3 no-scrollbar text-xs font-semibold">
            <button onclick="filtrarPorLiga('ALL')" class="btn-liga active bg-slate-900 text-white px-4 py-2 rounded-full whitespace-nowrap shadow-sm font-bold">Todos os Jogos</button>
        </div>

        <!-- LISTA DE JOGOS -->
        <div id="matchesContainer" class="space-y-3">
            <div class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-amber-500"></i>
                <p class="text-sm font-semibold">Carregando cotações atualizadas...</p>
            </div>
        </div>
    </main>

    <!-- BARRA FLUTUANTE DO BOLETIM -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 shadow-2xl z-30">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <button onclick="toggleBoletimModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 p-2.5 rounded-xl font-black shadow transition flex items-center justify-center">
                        <i class="fa-solid fa-receipt text-lg"></i>
                    </button>
                    <span id="cartCount" class="absolute -top-1.5 -right-1.5 bg-red-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-white">0</span>
                </div>
                <div>
                    <div class="text-[11px] text-slate-500 font-medium">Cotação Total: <span id="cartTotalOdd" class="text-slate-900 font-bold">1.00</span></div>
                    <div class="text-xs font-bold text-slate-900">Retorno Possível: <span id="cartPossibleReturn" class="text-emerald-600 font-extrabold">R$ 0,00</span></div>
                </div>
            </div>

            <button onclick="toggleBoletimModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-5 py-2.5 rounded-xl shadow transition">
                Finalizar Aposta
            </button>
        </div>
    </div>

    <!-- MODAL MAIS MERCADOS (ESTILO BET365 / BETANO) -->
    <div id="maisMercadosModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-xl rounded-t-2xl sm:rounded-2xl border border-slate-200 max-h-[85vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <div>
                    <h3 id="maisMercadosTitle" class="font-bold text-sm text-slate-900">Mais Mercados</h3>
                    <span id="maisMercadosSub" class="text-[11px] text-slate-500 font-medium">Partida</span>
                </div>
                <button onclick="fecharMaisMercados()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="maisMercadosBody" class="p-4 overflow-y-auto space-y-3 text-xs"></div>
        </div>
    </div>

    <!-- MODAL BOLETIM DE APOSTAS -->
    <div id="boletimModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl border border-slate-200 max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-amber-500"></i> Boletim de Apostas
                </h3>
                <button onclick="toggleBoletimModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="boletimItems" class="p-4 overflow-y-auto flex-1 space-y-2 text-xs divide-y divide-slate-100"></div>

            <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-3">
                <div class="flex justify-between text-xs text-slate-500">
                    <span>Mínimo de Jogos: <strong class="text-slate-900">3</strong></span>
                    <span>Ganho Máximo: <strong class="text-amber-600">R$ 500,00</strong></span>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nome do Apostador:</label>
                    <input type="text" id="apostadorNome" placeholder="Digite seu nome completo..." class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-amber-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Valor da Aposta (R$):</label>
                        <input type="number" id="apostadorValor" value="5.00" min="5" step="1" oninput="atualizarCalculosBoletim()" class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-amber-600 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Retorno Possível:</label>
                        <div id="boletimRetornoText" class="w-full bg-slate-200/60 border border-slate-300 rounded-xl px-3 py-2 text-xs font-black text-emerald-700">R$ 0,00</div>
                    </div>
                </div>

                <button onclick="gerarPréBilhetePIN()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-key"></i> GERAR CÓDIGO PIN
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT PRINCIPAL -->
    <script>
        const SUPABASE_URL = "https://weaffqocmxfczgwketrb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_-VzQcblLZ-6pYbxrYz-DpQ_VgNGRA6x";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let matchesData = [];
        let selectedLiga = 'ALL';
        let cartItems = [];
        let matchMaisMercadosAtual = null;

        document.addEventListener('DOMContentLoaded', carregarJogos);

        async function carregarJogos() {
            const container = document.getElementById('matchesContainer');
            const { data, error } = await supabaseClient
                .from('matches')
                .select('*')
                .eq('status', 'OPEN')
                .order('league', { ascending: true });

            if (error || !data) {
                container.innerHTML = `<div class="text-center py-8 text-red-500 text-xs font-semibold">Erro ao carregar partidas.</div>`;
                return;
            }

            matchesData = data;
            renderizarFiltrosLigas();
            renderizarJogos();
        }

        function renderizarFiltrosLigas() {
            const container = document.getElementById('leagueFilters');
            const ligasUnicas = [...new Set(matchesData.map(m => m.league))];
            
            let html = `<button onclick="filtrarPorLiga('ALL')" class="btn-liga ${selectedLiga === 'ALL' ? 'bg-slate-900 text-white font-bold' : 'bg-white text-slate-700 border border-slate-200'} px-4 py-2 rounded-full whitespace-nowrap shadow-sm">Todos os Jogos</button>`;
            
            ligasUnicas.forEach(liga => {
                html += `<button onclick="filtrarPorLiga('${liga}')" class="btn-liga ${selectedLiga === liga ? 'bg-slate-900 text-white font-bold' : 'bg-white text-slate-700 border border-slate-200'} px-4 py-2 rounded-full whitespace-nowrap shadow-sm">${liga}</button>`;
            });

            container.innerHTML = html;
        }

        function filtrarPorLiga(liga) {
            selectedLiga = liga;
            renderizarFiltrosLigas();
            renderizarJogos();
        }

        function limparFiltroEEstado() {
            selectedLiga = 'ALL';
            renderizarFiltrosLigas();
            renderizarJogos();
        }

        function renderizarJogos() {
            const container = document.getElementById('matchesContainer');
            const jogosFiltrados = selectedLiga === 'ALL' ? matchesData : matchesData.filter(m => m.league === selectedLiga);

            if (jogosFiltrados.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs font-semibold">Nenhuma partida disponível no momento.</div>`;
                return;
            }

            const agrupadoPorLiga = {};
            jogosFiltrados.forEach(m => {
                if (!agrupadoPorLiga[m.league]) agrupadoPorLiga[m.league] = [];
                agrupadoPorLiga[m.league].push(m);
            });

            let html = '';
            for (const [liga, jogos] of Object.entries(agrupadoPorLiga)) {
                html += `
                    <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-sm">
                        <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-200 text-xs font-black text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-trophy text-amber-500"></i> ${liga}
                        </div>
                        <div class="divide-y divide-slate-100">
                `;

                jogos.forEach(m => {
                    const dataObj = new Date(m.match_time);
                    const horaStr = dataObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const dataStr = dataObj.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short' });

                    html += `
                        <div class="p-3.5 hover:bg-slate-50 transition">
                            <div class="text-[10px] text-slate-400 font-bold mb-1 flex justify-between">
                                <span>${dataStr} às ${horaStr}</span>
                                <span class="text-slate-500 font-extrabold uppercase">1X2 Resultado Final</span>
                            </div>
                            <div class="flex items-center justify-between gap-2 mb-3">
                                <div class="text-xs font-bold text-slate-900 flex-1">${m.home_team}</div>
                                <div class="text-[10px] font-black text-slate-300 px-1">VS</div>
                                <div class="text-xs font-bold text-slate-900 flex-1 text-right">${m.away_team}</div>
                            </div>

                            <div class="grid grid-cols-3 gap-2 mb-2">
                                ${renderButtonOdd(m.id, 'Casa (1)', m.odd_home, '1X2', 'Casa')}
                                ${renderButtonOdd(m.id, 'Empate (X)', m.odd_draw, '1X2', 'Empate')}
                                ${renderButtonOdd(m.id, 'Fora (2)', m.odd_away, '1X2', 'Fora')}
                            </div>

                            <button onclick="abrirMaisMercados('${m.id}')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] py-2 rounded-xl font-bold flex items-center justify-center gap-1.5 transition border border-slate-200">
                                <i class="fa-solid fa-plus text-[10px] text-amber-500"></i> Mais Mercados
                            </button>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            container.innerHTML = html;
        }

        function renderButtonOdd(matchId, label, oddVal, mercadoNome, selecaoNome) {
            if (!oddVal || parseFloat(oddVal) <= 1.0) return `<div class="bg-slate-100 rounded-xl p-2 text-center text-slate-300 text-[10px]">-</div>`;
            
            const oddNum = parseFloat(oddVal);
            const isSelected = cartItems.some(i => i.matchId === matchId && i.selecaoNome === selecaoNome && i.mercadoNome === mercadoNome);
            const activeClass = isSelected ? 'bg-amber-500 text-slate-950 font-black border-amber-500 shadow-md' : 'bg-slate-50 hover:bg-slate-100 text-slate-800 border-slate-200';

            return `
                <button onclick="selecionarPalpite('${matchId}', '${mercadoNome}', '${selecaoNome}', ${oddNum})" class="${activeClass} border rounded-xl p-2 text-center transition flex flex-col items-center justify-center">
                    <span class="text-[9px] font-semibold ${isSelected ? 'text-slate-950' : 'text-slate-400'}">${label}</span>
                    <span class="text-xs font-black ${isSelected ? 'text-slate-950' : 'text-slate-900'}">${oddNum.toFixed(2)}</span>
                </button>
            `;
        }

        // MAIS MERCADOS ORGANIZADOS LADO A LADO (+ e -)
        function abrirMaisMercados(matchId) {
            const match = matchesData.find(m => m.id === matchId);
            if (!match) return;
            matchMaisMercadosAtual = match;

            document.getElementById('maisMercadosTitle').innerText = `${match.home_team} x ${match.away_team}`;
            document.getElementById('maisMercadosSub').innerText = match.league;

            const body = document.getElementById('maisMercadosBody');
            const mkts = match.markets || {};

            let html = '';

            for (const [nomeMercado, opcoes] of Object.entries(mkts)) {
                if (typeof opcoes === 'object' && opcoes !== null) {
                    const chaves = Object.keys(opcoes);

                    html += `
                        <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                            <div class="font-bold text-slate-800 mb-2.5 text-xs border-b border-slate-200/80 pb-1 flex justify-between items-center">
                                <span>${nomeMercado}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                    `;

                    chaves.forEach(opcaoNome => {
                        const oddVal = opcoes[opcaoNome];
                        html += renderButtonOdd(match.id, opcaoNome, oddVal, nomeMercado, opcaoNome);
                    });

                    html += `</div></div>`;
                }
            }

            if (!html) {
                html = `<div class="text-center py-8 text-slate-400 text-xs">Nenhum mercado adicional cadastrado para esta partida.</div>`;
            }

            body.innerHTML = html;
            document.getElementById('maisMercadosModal').classList.remove('hidden');
        }

        function fecharMaisMercados() { document.getElementById('maisMercadosModal').classList.add('hidden'); }

        function selecionarPalpite(matchId, mercadoNome, selecaoNome, oddVal) {
            const match = matchesData.find(m => m.id === matchId);
            if (!match) return;

            const indexExistente = cartItems.findIndex(i => i.matchId === matchId);

            if (indexExistente >= 0) {
                if (cartItems[indexExistente].selecaoNome === selecaoNome && cartItems[indexExistente].mercadoNome === mercadoNome) {
                    cartItems.splice(indexExistente, 1);
                } else {
                    cartItems[indexExistente] = { matchId, match, mercadoNome, selecaoNome, oddVal: parseFloat(oddVal) };
                }
            } else {
                cartItems.push({ matchId, match, mercadoNome, selecaoNome, oddVal: parseFloat(oddVal) });
            }

            atualizarCalculosBoletim();
            renderizarJogos();
            if (matchMaisMercadosAtual) abrirMaisMercados(matchMaisMercadosAtual.id);
        }

        function atualizarCalculosBoletim() {
            document.getElementById('cartCount').innerText = cartItems.length;

            let totalOdd = cartItems.reduce((acc, item) => acc * item.oddVal, 1);
            if (cartItems.length === 0) totalOdd = 1.00;

            document.getElementById('cartTotalOdd').innerText = totalOdd.toFixed(2);

            const valInput = parseFloat(document.getElementById('apostadorValor').value) || 5.00;
            let retornoBruto = valInput * totalOdd;
            if (retornoBruto > 500) retornoBruto = 500.00;

            const retornoFormatted = "R$ " + retornoBruto.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById('cartPossibleReturn').innerText = retornoFormatted;
            document.getElementById('boletimRetornoText').innerText = retornoFormatted;

            renderizarItensBoletimModal();
        }

        function renderizarItensBoletimModal() {
            const container = document.getElementById('boletimItems');
            if (cartItems.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400">Seu boletim está vazio.</div>`;
                return;
            }

            let html = '';
            cartItems.forEach((item, idx) => {
                html += `
                    <div class="py-2 flex justify-between items-center">
                        <div>
                            <div class="font-bold text-slate-800 text-xs">${item.match.home_team} x ${item.match.away_team}</div>
                            <div class="text-[10px] text-slate-500">${item.mercadoNome}: <strong class="text-amber-600">${item.selecaoNome}</strong></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-extrabold text-slate-900 text-xs">${item.oddVal.toFixed(2)}</span>
                            <button onclick="removerItemCarrinho(${idx})" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function removerItemCarrinho(index) {
            cartItems.splice(index, 1);
            atualizarCalculosBoletim();
            renderizarJogos();
        }

        function toggleBoletimModal() { document.getElementById('boletimModal').classList.toggle('hidden'); }
    </script>
</body>
</html>
